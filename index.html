<script>/* Share card: rendered in the browser from on-page portrait assets. */
(() => {
 'use strict';
 const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fallbackUrl = 'https://bonnews.net/taipei/';
 const safeBase = value => {
  try { const url = new URL(value || fallbackUrl); if (!['http:','https:'].includes(url.protocol)) return fallbackUrl; url.search=''; url.hash=''; return url.href; }
  catch { return fallbackUrl; }
 };
 const displayUrl = ctx => safeBase(ctx.baseUrl).replace(/^https?:\/\//,'').replace(/\/$/,'');

 // Share-card outcome.
 function outcome(ctx) {
  const answers = (ctx.answers || []).slice(0,(ctx.questions || []).length), candidates = ctx.candidates || [];
  const counts = candidates.map(c => ({...c, count:answers.filter(a=>a===c.id).length}));
  const sorted = [...counts].sort((a,b)=>b.count-a.count);
  const total = (ctx.questions || []).length, directional = counts.reduce((sum,c)=>sum+c.count,0);
  const winner = directional && sorted[0].count > sorted[1].count ? sorted[0] : null;
  const headline = winner ? '我選到最多的是' : !answers.some(Boolean) ? '這一輪，我先不選' : directional ? '兩個人，我選得一樣多' : answers.includes('neither') && !answers.includes('both') ? '兩邊的主張，我都不支持' : answers.includes('both') && !answers.includes('neither') ? '兩邊的主張，我都支持' : '兩個人，我沒有偏向哪一邊';
  return {counts, winner, headline, total};
 }
 const shareText = ctx => {
  const {winner} = outcome(ctx);
  return `${winner ? `不看名字選政見，我選到最多的是${winner.name}。` : '不看名字選政見，結果有點意外。'}你會選到誰？ ${safeBase(ctx.baseUrl)}`;
 };
 const cropStyle = c => {
  return `background-image:url('${esc(photoPath(c))}');background-size:cover;background-position:50% 0%`;
 };
 function previewHTML(ctx) {
  const o = outcome(ctx);
  const people = o.winner ? [o.winner] : o.counts;
  return `<div class="card-brand"><b>ETtoday新聞雲<em>2026 我的台北市長選擇卡</em></b></div>
   <p class="card-headline">不看名字選政見，<br>${esc(o.headline)}</p>
   <div class="card-people ${o.winner ? 'is-single' : 'is-pair'}">${people.map((c,i)=>`<div class="card-person"><span class="card-photo" role="img" aria-label="${esc(c.name)}" style="${cropStyle(c)}"></span><div class="card-info"><strong>${esc(c.name)}</strong>${o.winner ? `<p class="card-tally"><span>${o.total} 題裡</span>${o.counts.map(x=>x.id===c.id?`<b>${esc(x.name)} ${x.count} 次</b>`:`<span>${esc(x.name)} ${x.count} 次</span>`).join('')}</p>` : `<span class="card-count">${c.count} 次</span>`}</div></div>`).join('')}</div>
   <div class="card-cta"><b>你會選到誰？不看名字挑挑看 →</b><span>${esc(displayUrl(ctx))}</span></div>`;
 }
 function render(ctx) {
  return `<button class="primary share-open" id="open-share" aria-haspopup="dialog">2026 我的台北市長選擇卡</button>
   <dialog id="share-dialog" class="share-dialog" aria-label="2026 我的台北市長選擇卡">
    <div class="share-dialog-content"><div class="share-dialog-heading"><button type="button" class="text-button share-close" data-share-close aria-label="關閉選擇卡">關閉 ×</button></div>
    <div id="share-preview" class="share-card" aria-label="2026 我的台北市長選擇卡預覽">${previewHTML(ctx)}</div>
    <div class="share-actions"><button type="button" class="primary" id="download-card">下載圖片</button><button type="button" class="text-button" id="share-card" hidden>分享圖片</button></div>
    <p class="share-status" role="status" aria-live="polite" id="share-status"></p></div>
   </dialog>`;
 }
 function bind(ctx) {
  const dialog=document.getElementById('share-dialog'), opener=document.getElementById('open-share');
  if (!dialog || !opener) return;
  const status=dialog.querySelector('#share-status'), download=dialog.querySelector('#download-card'), share=dialog.querySelector('#share-card');
  let busy=false;
  const restore=()=>{ if(opener.isConnected) opener.focus(); };
  const close=()=>{ if(typeof dialog.close==='function') { try { dialog.close(); } catch { dialog.removeAttribute('open'); } } else dialog.removeAttribute('open'); restore(); };
  opener.onclick=()=>{ status.textContent=''; try { dialog.showModal(); } catch { dialog.setAttribute('open',''); dialog.setAttribute('aria-modal','true'); } dialog.querySelector('[data-share-close]').focus(); };
  dialog.querySelector('[data-share-close]').onclick=close;

  dialog.oncancel=event=>{ event.preventDefault(); close(); };
  dialog.onkeydown=event=>{
   if(event.key==='Escape') {event.preventDefault();close();}
   if(event.key==='Tab') {

   }
  };

  const downloadBlob=blob=>{
   const url=URL.createObjectURL(blob), anchor=document.createElement('a');
   anchor.href=url;anchor.download='2026我的台北市長選擇卡.png';document.body.appendChild(anchor);anchor.click();anchor.remove();
   setTimeout(()=>URL.revokeObjectURL(url),30000);
  };
  async function exportImage(nativeShare) {

    const blob=await canvasBlob(ctx,dialog.querySelector('#share-preview'));
    if(nativeShare) {
     const file=new File([blob],'2026我的台北市長選擇卡.png',{type:'image/png'});
     if(navigator.canShare?.({files:[file]})) {
      try {await navigator.share({files:[file],title:'2026 我的台北市長選擇卡',text:shareText(ctx)});status.textContent='已開啟圖片分享。';}
      catch(error) {if(error.name==='AbortError')status.textContent='已取消分享。';else {downloadBlob(blob);status.textContent='已改為下載圖片。';}}
     } else {downloadBlob(blob);status.textContent='此瀏覽器不支援圖片分享，已改為下載。';}
    } else {downloadBlob(blob);status.textContent=`圖片已下載。發文時附上網址，朋友才玩得到：${safeBase(ctx.baseUrl)}`;}
   } catch {status.textContent='圖片暫時無法製作，請再試一次。';}

  }

 }
 // A stalled portrait must not block the card; give up after a few seconds and draw without it.

 function drawPhoto(g,img,c,x,y,w,h,colors) {
  g.fillStyle=colors.accent;g.fillRect(x+14,y+14,w,h);
  g.fillStyle=colors.paper;g.fillRect(x,y,w,h);

 }

document.querySelector('#home-link')?.addEventListener('click',event=>{event.preventDefault();index=0;answers=[];layouts=[];guess=null;intro();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});
document.addEventListener('keydown',event=>{
 if(screen!=='question'||transitioning||event.ctrlKey||event.metaKey||event.altKey||event.target.closest('a,summary'))return;
 if(event.key.toLowerCase()==='a'){event.preventDefault();choose(0);}
 if(event.key.toLowerCase()==='b'){event.preventDefault();choose(1);}
 if(event.key==='Enter'&&answers[index]!==null&&event.target===main){event.preventDefault();advance();}
});
if(questions.length&&candidates.length===2)intro();else mount('<section class="section"><h1>資料準備中</h1><p>請稍後再試。</p></section>');
})();
</script>
</body></html>
